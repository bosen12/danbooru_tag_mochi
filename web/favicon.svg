<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A fanned hand of three cards; the front one is a Mochi card (spine, suit seal) with a drop of ink.
       No letters, so it reads the same in every language. -->
  <rect width="64" height="64" rx="14" fill="#10141b"/>
  <g transform="rotate(-20 32 56)">
    <rect x="20" y="12" width="24" height="34" rx="3.5" fill="#3f8fbf"/>
  </g>
  <g transform="rotate(18 32 56)">
    <rect x="20" y="12" width="24" height="34" rx="3.5" fill="#d0583a"/>
  </g>
  <g transform="rotate(-2 32 56)">
    <rect x="20" y="10" width="24" height="35" rx="3.5" fill="#efe8d8"/>
    <path d="M23.5 10h3.5v35h-3.5a3.5 3.5 0 0 1-3.5-3.5v-28a3.5 3.5 0 0 1 3.5-3.5z" fill="#d6ccb4"/>
    <circle cx="23.5" cy="14.6" r="2.2" fill="#d0583a"/>
    <path d="M35.5 19.5c-2.6 4.6-5.2 7.7-5.2 11a5.2 5.2 0 0 0 10.4 0c0-3.3-2.6-6.4-5.2-11z" fill="#1d4a64"/>
  </g>
</svg>
