<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <script src="language.js"></script>
    <script type="module" src="i18n.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090d" />
    <title>排字匣 · 介紹影片 Intro</title>
    <meta name="description" content="排字匣、墨池、疊印台的三分鐘介紹影片：畫面與配樂都是這一頁即時產生的。" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- 牌面跟墨池、疊印台是同一張（card.css）；影片的舞台、字幕在 intro.css，三分鐘版多的東西在 film.css。 -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="card.css" />
    <link rel="stylesheet" href="intro.css" />
    <link rel="stylesheet" href="film.css" />
    <link rel="stylesheet" href="locale.css" />
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="stage" id="stage" aria-hidden="true">
        <canvas class="bg" id="bg" width="960" height="540"></canvas>
        <canvas class="gl" id="gl" width="1920" height="1080"></canvas>
        <div class="world-box" id="world-box"><div class="world" id="world"></div></div>
        <div class="whipblur" id="whipblur" style="display: none"></div>
        <div class="hud" id="hud"></div>
        <div class="ink-wipe" id="wipe"></div>
        <div class="flash" id="flash"></div>
        <div class="grain" id="grain"></div>
        <div class="vignette"></div>
      </div>
    </div>

    <div class="gate" id="gate">
      <div class="gate-inner">
        <p class="gate-kicker">排字匣 · Danbooru case</p>
        <h1 class="gate-title">介紹影片<span>Intro film · 3:00</span></h1>
        <p class="gate-note">畫面、配樂都是這一頁即時產生的 · Picture and score are generated live in this page</p>
        <div class="gate-cuts" id="cuts" role="radiogroup" aria-label="選版本 · Version">
          <button type="button" role="radio" data-cut="full">完整版 3:00<small>排字匣 · 墨池 · 疊印台</small></button>
          <button type="button" role="radio" data-cut="tutorial">使用教學 4:30<small>墨池 &amp; 疊印台 · How to</small></button>
        </div>
        <div class="gate-load"><i id="load-bar"></i></div>
        <p class="gate-status" id="load-status">準備中 · Loading…</p>
        <button class="gate-play" id="play" type="button" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor" /></svg>
          <span>播放 Play</span>
        </button>
        <p class="gate-keys">建議開聲音、全螢幕 · 空白鍵 暫停 · ← → 快轉 · F 全螢幕 · M 靜音 &nbsp;/&nbsp; Sound on · Space pause · ← → seek · F fullscreen · M mute</p>
      </div>
    </div>

    <div class="bar" id="bar">
      <button type="button" id="pp" aria-label="暫停 Pause"></button>
      <div class="bar-track" id="track"><i id="fill"></i></div>
      <span class="bar-time" id="time">0:00</span>
    </div>

    <script type="module" src="film.js"></script>
  </body>
</html>
