name: Bug report / 問題回報
description: Installation, generation or UI problems / 安裝、生圖或介面問題
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 重現步驟
      description: Include expected and actual behavior. / 請描述預期與實際結果。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 環境
      description: OS, Python version, ComfyUI version/install type, GPU and VRAM, browser, Mochi commit/release. / 系統、版本、顯卡、瀏覽器及 Mochi 版本。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error text or screenshot / 錯誤訊息或截圖
      description: Include relevant server/setup.log errors. Remove tokens, webhooks and private data. / 請先移除憑證與私人資料。
  - type: dropdown
    id: stage
    attributes:
      label: Where did it fail? / 哪個階段出錯？
      options:
        - Launch / 啟動
        - First-time setup / 首次準備
        - Cards and composition / 卡牌組合
        - Generation / 生圖
        - Gallery / 作品冊
        - Other / 其他
