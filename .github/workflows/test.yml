name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compile Python
        run: python -m compileall -q server.py card_usage.py card_decks.py gen_log.py lora_scan.py recipes.py workflows.py scripts

      - name: Language and translation
        run: node tests/test_i18n.mjs

      # No ComfyUI in CI: every page and read-only API must still answer.
      - name: Server smoke test
        shell: bash
        env:
          NO_CARD_FETCH: "1"
          PORT: "8796"
          COMFY_API: http://127.0.0.1:9
          PYTHONUTF8: "1"
        run: |
          python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8796/ && break; sleep 1; done
          fail=0
          for p in / /fuse.html /book.html /album.html /intro.html /tutorial.html /lexicon.json /engine.js \
                   /api/ping /api/decks /api/usage /api/recipes /api/genlog /api/genlog/stats /api/workflows /api/checkpoints /api/loras; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8796$p")
            echo "$code $p"
            [ "$code" = 200 ] || fail=1
          done
          if [ "$fail" != 0 ]; then cat server.log; exit 1; fi
